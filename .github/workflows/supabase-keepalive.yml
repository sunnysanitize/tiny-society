name: Supabase Keep-Alive

# Free-tier Supabase pauses a project after 7 days of no DB activity.
# This runs a lightweight query every 3 days to reset that timer so the
# project stays awake for occasional demos.

on:
  schedule:
    - cron: "0 8 */3 * *" # every 3 days at 08:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive() to keep the DB awake
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          body=$(mktemp)
          status=$(curl -sS -o "${body}" -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")
          echo "Supabase responded with HTTP ${status}: $(cat "${body}")"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "Keep-alive ping failed (non-2xx). Check the anon key, or the project may be paused." >&2
            exit 1
          fi
